<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>追加変更 記録</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#1b2a41">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="追加変更記録">
<style>
:root{
  --ink:#111;--bg:#f4f4f2;--card:#fff;--line:#c9c9c4;--head:#1b2a41;
  --pri:#c2410c;--mute:#55554f;--ok:#166534;--bad:#b91c1c;--soft:#ececec;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  font-size:17px;line-height:1.5}
.bar{position:sticky;top:0;z-index:5;background:var(--head);color:#fff;display:flex;align-items:center;gap:8px;
  min-height:56px;padding:6px 12px;padding-top:max(6px,env(safe-area-inset-top))}
.bar h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .ico{min-height:44px;min-width:44px;padding:0 12px;border:1.5px solid rgba(255,255,255,.7);border-radius:10px;
  background:transparent;color:#fff;font:inherit;font-size:15px;font-weight:700}
main{padding:12px 12px 120px;max-width:640px;margin:0 auto}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:12px;
  border:2px solid var(--ink);background:#fff;color:var(--ink);font:inherit;font-weight:700;width:100%;cursor:pointer}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.link{border:0;background:transparent;min-height:44px;font-weight:400;text-decoration:underline;color:var(--mute)}
.btn:disabled{opacity:.45}
.btn.sm{min-height:44px;font-size:15px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 10px}
.mute{color:var(--mute);font-size:15px}
input[type=text],textarea,select{width:100%;font:inherit;font-size:17px;padding:12px;border:2px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink)}
textarea{resize:none}
label.lb{display:block;font-weight:700;margin:2px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0}
.chips .cl{width:100%;font-size:14px;color:var(--mute);margin-top:2px}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:1.5px solid var(--mute);background:#fff;color:var(--ink);font:inherit;font-size:15px}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:52px;border-radius:12px;border:2px solid var(--ink);background:#fff;color:var(--ink);font:inherit;font-weight:700}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.step{display:flex;align-items:center;gap:12px}
.step button{width:64px;height:56px;border-radius:12px;border:2px solid var(--ink);background:#fff;font-size:28px;font-weight:700;color:var(--ink)}
.step .n{flex:1;text-align:center;font-size:28px;font-weight:700}
.photo{width:100%;aspect-ratio:4/3;background:#e4e4e4;border:1px solid #999;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--mute);overflow:hidden;margin-bottom:8px}
.photo img{width:100%;height:100%;object-fit:contain}
.ph{border:1px solid var(--line);border-radius:12px;padding:10px;margin:0 0 12px;background:#fafaf8}
.site{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;padding:14px;margin:0 0 10px;background:#fff;
  border:2px solid var(--ink);border-radius:14px;font:inherit;color:var(--ink);min-height:68px;cursor:pointer}
.site b{font-size:18px}
.rec{display:flex;gap:10px;align-items:stretch;background:#fff;border:1px solid var(--line);border-radius:14px;margin:0 0 10px;overflow:hidden}
.rec .ck{width:56px;flex:none;display:flex;align-items:center;justify-content:center;border:0;border-right:1px solid var(--line);background:#fafaf8}
.rec .ck input{width:28px;height:28px}
.rec .body{flex:1;min-width:0;display:flex;gap:10px;padding:8px 8px 8px 0;border:0;background:transparent;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.rec .th{width:84px;height:63px;flex:none;border-radius:8px;background:#e4e4e4;object-fit:cover}
.rec .tx{min-width:0;flex:1}
.rec .tx div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;border:1px solid var(--ink);border-radius:6px;padding:0 6px;font-size:13px;font-weight:700;margin-left:6px}
.tag.warn{border-color:var(--bad);color:var(--bad)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.dock .in{max-width:640px;margin:0 auto;display:flex;gap:10px}
.dock .btn.sm{flex:none;width:112px}
.banner{background:#fff7ed;border:1.5px solid var(--pri);border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:15px}
.banner .x{float:right;border:0;background:transparent;font-size:20px;min-width:44px;min-height:44px;margin:-8px -10px 0 0}
.pages{display:flex;flex-direction:column;gap:14px;margin-top:10px}
.pg canvas{width:100%;height:auto;border:1px solid var(--line);background:#fff;display:block}
.pg .pgn{text-align:center;font-size:14px;color:var(--mute);margin-top:4px}
#toast{position:fixed;left:12px;right:12px;bottom:92px;z-index:20;display:flex;justify-content:center;pointer-events:none}
#toast div{background:#222;color:#fff;border-radius:10px;padding:12px 16px;font-size:16px;max-width:520px;opacity:0;transition:opacity .2s}
#toast div.on{opacity:1}
h2{font-size:18px;margin:4px 0 8px}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"><div></div></div>
<script>
'use strict';

/* ============================================================
 * 設定
 * APPROVAL_URL に承認用スクリプト(gas/Code.gs)のURLを入れると、
 * 「申請 → 管理者が承認」しないと使えない運用になります。
 * 空のままなら承認なしで動きます(試用・開発用)。
 * ========================================================== */
const CONFIG = {
  APPROVAL_URL: 'https://script.google.com/macros/s/AKfycbyh77k-hWsUqDc3fJWPlr7BhG6hhX4ReNszEiQrD49UlXyvllTwSGaEcdcS59ofb-ME/exec',
  MAX_PAGES_PER_PDF: 10,   // 1回のPDFに入れられる用紙の枚数(スマホのメモリ対策。超えるときは分けて出力)
  VERSION: '1.5.0'
};

const KINDS = ['着手前', '施工中', '完了後'];
const PRESET_CONTENT = ['開口部の追加', '寸法の変更', '位置の変更', '段差の手直し', '型枠の追加', '一部撤去'];
const PRESET_WORK = ['型枠の加工・組立', '型枠の組替え', '型枠の解体', '補強', '寸法の確認', '清掃'];

/* ---------- 小さな道具 ---------- */
const $ = (s) => document.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === 'value') el.value = v;
      else if (k === 'checked' || k === 'disabled' || k === 'hidden') el[k] = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
function uid() {
  return (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 12));
}
const pad2 = (n) => String(n).padStart(2, '0');
function fmtDate(ts) { const d = new Date(ts); return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate(); }
function fmtMD(ts) { const d = new Date(ts); return (d.getMonth() + 1) + '/' + d.getDate(); }
function fmtTime(ts) { const d = new Date(ts); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function todayJP() { const d = new Date(); return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日'; }
const fmtP = (n) => (Number.isInteger(n) ? String(n) : n.toFixed(1)) + ' 人';  // 人数(0.5人単位)
function ymd(d) { return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()); }
let toastTimer;
function toast(msg) {
  const box = $('#toast div');
  box.textContent = msg; box.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => box.classList.remove('on'), 2600);
}
let liveURLs = [];
function objURL(blob) { const u = URL.createObjectURL(blob); liveURLs.push(u); return u; }
function cleanupURLs() { liveURLs.forEach((u) => URL.revokeObjectURL(u)); liveURLs = []; }
function mount(...nodes) { $('#app').replaceChildren(...nodes); window.scrollTo(0, 0); }
function topBar(title, opt = {}) {
  return h('header', { class: 'bar' },
    opt.back ? h('button', { class: 'ico', 'aria-label': '戻る', onClick: opt.back }, '戻る') : null,
    h('h1', null, title),
    opt.right || null);
}

/* ---------- 端末内データベース(IndexedDB) ---------- */
let dbp;
function db() {
  if (!dbp) {
    dbp = new Promise((res, rej) => {
      const r = indexedDB.open('kiroku', 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        d.createObjectStore('sites', { keyPath: 'id' });
        const rs = d.createObjectStore('records', { keyPath: 'id' });
        rs.createIndex('siteId', 'siteId');
        d.createObjectStore('kv');
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  return dbp;
}
const rq = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
async function dbGet(s, k) { const d = await db(); return rq(d.transaction(s).objectStore(s).get(k)); }
async function dbAll(s) { const d = await db(); return rq(d.transaction(s).objectStore(s).getAll()); }
async function dbBySite(siteId) { const d = await db(); return rq(d.transaction('records').objectStore('records').index('siteId').getAll(siteId)); }
async function dbPut(s, v, k) {
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction(s, 'readwrite');
    if (k === undefined) t.objectStore(s).put(v); else t.objectStore(s).put(v, k);
    t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
async function dbDel(s, keys) {
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction(s, 'readwrite');
    for (const k of [].concat(keys)) t.objectStore(s).delete(k);
    t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
const kvGet = (k) => dbGet('kv', k);
const kvSet = (k, v) => dbPut('kv', v, k);
const kvDel = (k) => dbDel('kv', k);

/* 追加変更工事 1件 = { id, siteId, location, content, work, people, photos:[{id,blob,kind,shotAt,fileMtime,memo}], draft, createdAt, updatedAt } */
function normRec(r) {
  if (!r) return r;
  if (!r.photos) {   // 旧形式(写真1枚=1件)で保存されたものを読み替える
    r.photos = r.photo ? [{ id: uid(), blob: r.photo, kind: r.kind || '着手前', shotAt: r.shotAt, fileMtime: r.fileMtime || null, memo: '' }] : [];
  }
  r.createdAt = r.createdAt || (r.photos[0] && r.photos[0].shotAt) || Date.now();
  r.updatedAt = r.updatedAt || r.createdAt;
  return r;
}
const pagesOf = (r) => Math.max(1, Math.ceil(r.photos.length / 3));

/* ---------- 画面の切り替え ---------- */
const selBySite = {};   // 現場ごとの「PDFにする工事」の選択
let routeSeq = 0;
function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }
function goReplace(hash) { history.replaceState(null, '', hash); route(); }
window.addEventListener('hashchange', route);

async function route() {
  const my = ++routeSeq;
  cleanupURLs();
  try {
    const gate = await gateState();
    if (my !== routeSeq) return;
    if (gate !== 'ok') return gateView(gate);
    const [name, a, b] = location.hash.replace(/^#/, '').split('/');
    if (name === 'site' && a) return await viewRecords(a);
    if (name === 'edit' && a) return await viewEdit(a, b && b !== 'new' ? b : null);
    if (name === 'export' && a) return await viewExport(a);
    if (name === 'settings') return await viewSettings();
    if (name === 'feedback') return await viewFeedback();
    if (name === 'backup') return await viewBackup();
    return await viewSites();
  } catch (e) {
    console.error(e);
    mount(topBar('エラー'), h('main', null,
      h('div', { class: 'card' }, h('p', null, 'うまく動きませんでした。もう一度開き直してください。'),
        h('p', { class: 'mute' }, String(e && e.message || e))),
      h('button', { class: 'btn pri', onClick: () => location.reload() }, '開き直す')));
  }
}

/* ============================================================
 * 利用の承認
 * ========================================================== */
async function gateState() {
  if (!CONFIG.APPROVAL_URL) return (await kvGet('author')) ? 'ok' : 'apply';
  const ap = await kvGet('approval');
  if (!ap) return 'apply';
  if (ap.status === 'approved') return 'ok';
  if (ap.status === 'rejected') return 'rejected';
  return 'pending';
}
async function fetchJSON(url, ms = 15000) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms);
  try {
    const r = await fetch(url, { signal: ctl.signal });
    return await r.json();
  } finally { clearTimeout(t); }
}
async function deviceId() {
  let id = await kvGet('deviceId');
  if (!id) { id = uid(); await kvSet('deviceId', id); }
  return id;
}
async function checkStatus() {
  const id = await deviceId();
  const r = await fetchJSON(CONFIG.APPROVAL_URL + '?action=status&id=' + encodeURIComponent(id));
  if (!r || !r.ok) throw new Error('status');
  return r.status; // approved | pending | rejected | none
}
async function revalidate() {
  if (!CONFIG.APPROVAL_URL) return;
  const ap = await kvGet('approval');
  if (!ap || ap.status !== 'approved') return;
  try {
    const st = await checkStatus();
    if (st === 'rejected') { await kvSet('approval', { status: 'rejected', at: Date.now() }); route(); }
  } catch (e) { /* 電波がないときは今のまま使える */ }
}
function gateView(state) {
  if (state === 'apply') return viewApply();
  if (state === 'rejected') {
    return mount(topBar('利用できません'), h('main', null,
      h('div', { class: 'card' }, h('p', null, '利用が承認されませんでした。管理者にお問い合わせください。')),
      h('button', { class: 'btn', onClick: async () => { await kvDel('approval'); route(); } }, '申請をやり直す')));
  }
  return viewPending();
}
async function viewApply() {
  const gateOn = !!CONFIG.APPROVAL_URL;
  const name = h('input', { type: 'text', maxlength: '20', autocomplete: 'name', value: (await kvGet('author')) || '', id: 'ap-name' });
  const comp = h('input', { type: 'text', maxlength: '40', autocomplete: 'organization', value: (await kvGet('company')) || '', id: 'ap-comp' });
  const btn = h('button', { class: 'btn pri' }, gateOn ? '申請する' : '始める');
  btn.addEventListener('click', async () => {
    const n = name.value.trim(), c = comp.value.trim();
    if (!n) return toast('お名前を入力してください');
    if (gateOn && !c) return toast('会社名を入力してください');
    btn.disabled = true;
    try {
      await kvSet('author', n); await kvSet('company', c);
      if (gateOn) {
        const id = await deviceId();
        const r = await fetchJSON(CONFIG.APPROVAL_URL + '?action=apply&id=' + encodeURIComponent(id) +
          '&name=' + encodeURIComponent(n) + '&company=' + encodeURIComponent(c));
        if (!r || !r.ok) throw new Error('apply');
        await kvSet('approval', { status: r.status === 'approved' ? 'approved' : r.status === 'rejected' ? 'rejected' : 'pending', at: Date.now() });
      }
      route();
    } catch (e) {
      btn.disabled = false;
      toast('送信できませんでした。電波のある場所でもう一度お試しください');
    }
  });
  mount(topBar(gateOn ? '利用申請' : 'はじめに'), h('main', null,
    h('div', { class: 'card' },
      h('p', null, gateOn ? '利用には管理者の承認が必要です。お名前と会社名を入力して申請してください。（承認のために管理者へ送られるのはこの2つだけです。写真や記録は送られません）' : 'お名前を入力してください。記録用紙の「作成者」に印字されます。'),
      h('label', { class: 'lb', for: 'ap-name' }, 'お名前（作成者）'), name,
      gateOn ? h('div', null, h('label', { class: 'lb', for: 'ap-comp', style: { marginTop: '14px' } }, '会社名'), comp) : null),
    btn));
}
async function viewPending() {
  const msg = h('p', null, '管理者が確認しています。承認されるとこのアプリが使えるようになります。');
  const btn = h('button', { class: 'btn pri' }, '承認されたか確認する');
  const check = async (quiet) => {
    btn.disabled = true;
    try {
      const st = await checkStatus();
      if (st === 'approved') { await kvSet('approval', { status: 'approved', at: Date.now() }); return route(); }
      if (st === 'rejected') { await kvSet('approval', { status: 'rejected', at: Date.now() }); return route(); }
      if (st === 'none') { await kvDel('approval'); return route(); }
      if (!quiet) toast('まだ承認されていません');
    } catch (e) { if (!quiet) toast('確認できませんでした。電波のある場所でお試しください'); }
    btn.disabled = false;
  };
  btn.addEventListener('click', () => check(false));
  mount(topBar('承認待ち'), h('main', null,
    h('div', { class: 'card' }, h('h2', null, '申請を送りました'), msg,
      h('p', { class: 'mute' }, '申請者: ' + ((await kvGet('author')) || ''))),
    btn));
  check(true);
}

/* ============================================================
 * 現場の一覧
 * ========================================================== */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; });
function isStandalone() { return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }
function installBanner() {
  if (isStandalone()) return null;
  try { if (sessionStorage.getItem('hideInstall')) return null; } catch (e) { /* 無視 */ }
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const box = h('div', { class: 'banner' },
    h('button', { class: 'x', 'aria-label': '閉じる', onClick: () => { try { sessionStorage.setItem('hideInstall', '1'); } catch (e) { /* 無視 */ } box.remove(); } }, '×'),
    h('b', null, 'ホーム画面に追加してお使いください'),
    h('div', null, ios
      ? 'Safariの共有ボタン（四角に上向き矢印）→「ホーム画面に追加」。追加しないと、記録が消えることがあります。'
      : 'ブラウザのメニューから「ホーム画面に追加」または「アプリをインストール」を選んでください。'),
    (!ios && deferredPrompt) ? h('div', { style: { marginTop: '8px' } },
      h('button', { class: 'btn sm pri', onClick: async () => { deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; box.remove(); } }, 'ホーム画面に追加')) : null);
  return box;
}
async function viewSites() {
  const sites = await dbAll('sites');
  const recs = (await dbAll('records')).map(normRec);
  const cnt = {}, last = {};
  recs.forEach((r) => { cnt[r.siteId] = (cnt[r.siteId] || 0) + 1; last[r.siteId] = Math.max(last[r.siteId] || 0, r.updatedAt); });
  sites.sort((a, b) => (last[b.id] || b.createdAt) - (last[a.id] || a.createdAt));
  const input = h('input', { type: 'text', id: 'newSite', placeholder: '例: 〇〇ビル新築工事', maxlength: '40', autocomplete: 'off' });
  const add = async () => {
    const name = input.value.trim();
    if (!name) return toast('現場名を入力してください');
    const s = { id: uid(), name, createdAt: Date.now() };
    await dbPut('sites', s);
    go('#site/' + s.id);
  };
  const backupTip = await backupBanner();
  mount(
    topBar('現場を選ぶ', { right: h('button', { class: 'ico', onClick: () => go('#settings') }, '設定') }),
    h('main', null,
      installBanner(),
      backupTip,
      sites.length
        ? h('div', null, sites.map((s) => h('button', { class: 'site', onClick: () => go('#site/' + s.id) },
            h('b', null, s.name),
            h('span', { class: 'mute' }, '追加変更工事 ' + (cnt[s.id] || 0) + '件' + (last[s.id] ? '　最終 ' + fmtDate(last[s.id]) : '')))))

function loadViaImg(blob) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(blob);
    const im = new Image();
    im.onload = () => { URL.revokeObjectURL(u); res(im); };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('image')); };
    im.src = u;
  });
}
async function loadBitmap(blob) {
  try { return await createImageBitmap(blob); } catch (e) { return await loadViaImg(blob); }
}
// 写真ファイルに記録された撮影日時(EXIF)を読む。無い・読めないときは null
async function readExifDate(file) {
  try {
    const buf = await file.slice(0, 262144).arrayBuffer();
    const v = new DataView(buf);
    if (v.getUint16(0) !== 0xFFD8) return null;
    let o = 2;
    while (o + 4 < v.byteLength) {
      const mk = v.getUint16(o), len = v.getUint16(o + 2);
      if (mk === 0xFFE1 && v.getUint32(o + 4) === 0x45786966) {
        const t = o + 10, le = v.getUint16(t) === 0x4949;
        const u16 = (x) => v.getUint16(x, le), u32 = (x) => v.getUint32(x, le);
        const ifd = (off, want) => {
          const n = u16(t + off);
          for (let k = 0; k < n; k++) {
            const e = t + off + 2 + k * 12;
            if (u16(e) === want) return { type: u16(e + 2), count: u32(e + 4), val: e + 8 };
          }
          return null;
        };
        const ex = ifd(u32(t + 4), 0x8769);
        if (!ex) return null;
        const dt = ifd(u32(ex.val), 0x9003) || ifd(u32(ex.val), 0x9004);
        if (!dt || dt.count < 19) return null;
        const so = t + u32(dt.val);
        let str = '';
        for (let k = 0; k < 19; k++) str += String.fromCharCode(v.getUint8(so + k));
        const m = str.match(/^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})$/);
        if (!m) return null;
        const d = new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]);
        return isNaN(d) || d.getFullYear() < 2000 ? null : d.getTime();
      }
      if ((mk & 0xFF00) !== 0xFF00) return null;
      o += 2 + len;
    }
  } catch (e) { /* 読めなければ null */ }
  return null;
}
async function processPhoto(file) {
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) { bmp = await loadViaImg(file); }
  const w0 = bmp.width, h0 = bmp.height;
  const sc = Math.min(1, 1280 / Math.max(w0, h0));
  const w = Math.round(w0 * sc), hh = Math.round(h0 * sc);
  const c = document.createElement('canvas'); c.width = w; c.height = hh;
  c.getContext('2d').drawImage(bmp, 0, 0, w, hh);
  if (bmp.close) bmp.close();
  const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.8));
  if (!blob) throw new Error('jpeg');
  return blob;
}

  const out = [];
  for (const r of recs) { const v = (r[key] || '').trim(); if (v && !out.includes(v)) out.push(v); if (out.length >= 4) break; }
  return out;
}

/* ============================================================
 * A4記録用紙の描画 と PDF 作成
 * 1ページ = 写真3枚。写真1枚ごとに、右にその工事の 変更箇所・変更内容・作業内容・人数 を印字する。
 * 文字も含めて画像として用紙に描き、1ページ=1枚のJPEGとしてPDFに入れる。
 * (日本語フォントをアプリに同梱しなくてよく、端末のフォントで確実に表示できる)
 * ========================================================== */
const FONT = '"Hiragino Sans","Noto Sans JP","Noto Sans CJK JP","Yu Gothic","Meiryo",sans-serif';
const PAGE_W = 794, PAGE_H = 1123, SCALE = 1240 / 794;

function fitLine(g, text, maxW) {
  let t = String(text || '');
  if (g.measureText(t).width <= maxW) return t;
  while (t.length > 1 && g.measureText(t + '…').width > maxW) t = t.slice(0, -1);
  return t + '…';
}
function wrapText(g, text, maxW, maxLines) {
  const lines = [];
  for (const para of String(text || '').split(/\r?\n/)) {
    let cur = '';
    for (const ch of Array.from(para)) {
      if (cur && g.measureText(cur + ch).width > maxW) { lines.push(cur); cur = ch; } else cur += ch;
    }
    lines.push(cur);
  }
  if (lines.length > maxLines) {
    lines.length = maxLines;
    let l = lines[maxLines - 1];
    while (l.length && g.measureText(l + '…').width > maxW) l = l.slice(0, -1);
    lines[maxLines - 1] = l + '…';
  }
  return lines;
}
// 欄に収まらない長さのときは、文字を少しずつ小さくして最後まで印字する(12pxで足りなければ省略)
function fitText(g, text, maxW, maxLines) {
  let res;
  for (const size of [15, 14, 13, 12]) {
    g.font = '400 ' + size + 'px ' + FONT;
    res = { size, lines: wrapText(g, text, maxW, 999) };
    if (res.lines.length <= maxLines) return res;
  }
  res.lines = wrapText(g, text, maxW, maxLines);
  return res;
}
function headCell(g, x, y, w, hgt, label, lw, val) {
  g.fillStyle = '#ececec'; g.fillRect(x, y, lw, hgt);
  g.strokeStyle = '#333'; g.lineWidth = 1; g.strokeRect(x + .5, y + .5, w - 1, hgt - 1);
  g.beginPath(); g.moveTo(x + lw + .5, y); g.lineTo(x + lw + .5, y + hgt); g.stroke();
  g.fillStyle = '#111'; g.textAlign = 'center'; g.font = '700 13px ' + FONT;
  g.fillText(label, x + lw / 2, y + hgt / 2);
  g.textAlign = 'left';
  // 長いときは文字を小さくして最後まで入れる(11pxでも入らなければ省略)
  let size = 15;
  for (; size > 11; size--) { g.font = '400 ' + size + 'px ' + FONT; if (g.measureText(val).width <= w - lw - 20) break; }
  g.font = '400 ' + size + 'px ' + FONT;
  g.fillText(fitLine(g, val, w - lw - 20), x + lw + 10, y + hgt / 2);
}
// 1段 = 写真1枚。左に写真(下に No.・撮影日時・種類)、右にその工事の 変更箇所・変更内容・作業内容・人数
const SLOT_Y0 = 168, SLOT_STEP = 290, SLOT_H = 280;

  if (!s) {

    return;
  }
  const p = s.photo, rec = s.rec;
  const px = 47, py = y + 9, pw = 300, ph = 225;
  g.fillStyle = '#e4e4e4'; g.fillRect(px, py, pw, ph);
  const bmp = await loadBitmap(p.blob);
  const k = Math.min(pw / bmp.width, ph / bmp.height);
  const dw = bmp.width * k, dh = bmp.height * k;
  g.drawImage(bmp, px + (pw - dw) / 2, py + (ph - dh) / 2, dw, dh);
  if (bmp.close) bmp.close();
  g.strokeStyle = '#999'; g.strokeRect(px + .5, py + .5, pw - 1, ph - 1);
  // 写真の下: No. 撮影日時 / 種類
  const cy = py + ph + 22;
  g.fillStyle = '#111'; g.textAlign = 'left'; g.font = '700 12px ' + FONT;
  g.fillText('No.' + s.label + '  ' + fmtDate(p.shotAt) + ' ' + fmtTime(p.shotAt) + (p.src === 'library' ? ' ※' : ''), px, cy);
  g.font = '700 11px ' + FONT;
  let tx = px + pw;
  for (let i = KINDS.length - 1; i >= 0; i--) {
    const t = KINDS[i], w = g.measureText(t).width + 12, on = t === p.kind;

    g.fillStyle = on ? '#fff' : '#111'; g.textAlign = 'center'; g.fillText(t, tx + w / 2, cy);
    tx -= 4;

  // 右: 工事の内容
  const x = px + pw + 12, w = 747 - x, lw = 66, top = py;
  const hs = [60, 70, 70, 59];
  const labels = ['変更箇所', '変更内容', '作業内容', '人数'];
  const maxLines = [2, 2, 2, 1];
  const texts = [rec.location, rec.content, rec.work, fmtP(rec.people)];
  g.strokeStyle = '#333'; g.lineWidth = 1; g.strokeRect(x + .5, top + .5, w - 1, 260);
  let ry = top + 1;
  for (let i = 0; i < 4; i++) {
    g.fillStyle = '#ececec'; g.fillRect(x + 1, ry, lw, hs[i]);
    g.strokeStyle = '#333';
    g.beginPath(); g.moveTo(x + 1 + lw + .5, ry); g.lineTo(x + 1 + lw + .5, ry + hs[i]); g.stroke();
    if (i < 3) { g.beginPath(); g.moveTo(x + 1, ry + hs[i] - .5); g.lineTo(x + w - 1, ry + hs[i] - .5); g.stroke(); }
    g.fillStyle = '#111'; g.textAlign = 'center'; g.font = '700 12px ' + FONT;
    g.fillText(labels[i], x + 1 + lw / 2, ry + hs[i] / 2);
    g.textAlign = 'left';
    if (i === 3) {
      g.font = '700 20px ' + FONT; g.fillText(texts[i], x + 1 + lw + 10, ry + hs[i] / 2);
    } else {
      const fit = fitText(g, texts[i], w - 2 - lw - 20, maxLines[i]);
      g.font = '400 ' + fit.size + 'px ' + FONT;
      const lh = Math.round(fit.size * 1.45), t0 = ry + (hs[i] - fit.lines.length * lh) / 2;
      fit.lines.forEach((ln, j) => g.fillText(ln, x + 1 + lw + 10, t0 + lh * (j + .5)));
    }
    ry += hs[i];
  }
}

// 選んだ工事の写真を、工事順(着手前→施工中→完了後)に1枚ずつ並べ、3枚ごとに用紙を分ける
function buildPageDefs(recs) {
  const slots = [];
  recs.forEach((r, k) => {
    const ph = r.photos.slice().sort((a, b) => (KINDS.indexOf(a.kind) - KINDS.indexOf(b.kind)) || (a.shotAt - b.shotAt));
    ph.forEach((p, j) => slots.push({ rec: r, photo: p, label: (k + 1) + (ph.length > 1 ? '-' + (j + 1) : '') }));
  });
  const defs = [];
  for (let i = 0; i < slots.length; i += 3) defs.push({ slots: slots.slice(i, i + 3) });
  return defs;
}
async function renderAll(defs, meta) {
  const pages = [];
  for (let i = 0; i < defs.length; i++) pages.push(await renderPage(defs[i], i, defs.length, meta));
  return pages;
}
// 画像(JPEG)をA4の1ページとして並べただけのシンプルなPDFを作る
function makePdf(jpegs) {
  const enc = new TextEncoder();
  const chunks = []; let len = 0; const off = [];
  const push = (x) => { const b = typeof x === 'string' ? enc.encode(x) : x; chunks.push(b); len += b.length; };
  const PW = 595.28, PH = 841.89;
  const n = jpegs.length;
  push('%PDF-1.4\n');
  const obj = (id, body) => { off[id] = len; push(id + ' 0 obj\n'); push(body); push('\nendobj\n'); };
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  const kids = jpegs.map((_, i) => (3 + 3 * i) + ' 0 R').join(' ');
  obj(2, '<< /Type /Pages /Kids [' + kids + '] /Count ' + n + ' >>');
  jpegs.forEach((j, i) => {
    const pid = 3 + 3 * i, cid = 4 + 3 * i, iid = 5 + 3 * i;
    obj(pid, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + PW + ' ' + PH + '] /Resources << /XObject << /Im0 ' + iid + ' 0 R >> >> /Contents ' + cid + ' 0 R >>');
    const cs = 'q ' + PW + ' 0 0 ' + PH + ' 0 0 cm /Im0 Do Q';
    obj(cid, '<< /Length ' + cs.length + ' >>\nstream\n' + cs + '\nendstream');
    off[iid] = len;
    push(iid + ' 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + j.w + ' /Height ' + j.h +
      ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + j.data.length + ' >>\nstream\n');
    push(j.data);
    push('\nendstream\nendobj\n');
  });
  const count = 3 + 3 * n;
  const xref = len;
  let x = 'xref\n0 ' + count + '\n0000000000 65535 f \n';
  for (let i = 1; i < count; i++) x += String(off[i]).padStart(10, '0') + ' 00000 n \n';
  push(x);
  push('trailer\n<< /Size ' + count + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF\n');
  return chunks;
}
async function canvasesToPdfFile(canvases, fileName) {
  const jpegs = [];
  for (const c of canvases) {
    const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.88));
    jpegs.push({ data: new Uint8Array(await blob.arrayBuffer()), w: c.width, h: c.height });
  }
  return new File(makePdf(jpegs), fileName, { type: 'application/pdf' });
}
function safeName(s) { return String(s).replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 40) || '現場'; }

}

/* ============================================================
 * バックアップ・復元
 * 記録と写真を ZIP ファイル1つに書き出し、利用者が自分で保存する。サーバーには送らない。
 * ZIP の中身: data.json(記録) と 写真/現場名/*.jpg。圧縮はしない(写真はもともと JPEG のため)。
 * 承認の状態と端末IDは入れない(別のスマホで戻したときは、そのスマホで申請し直す)。
 * ========================================================== */
const BACKUP_APP = 'kiroku-backup';
const BACKUP_FORMAT = 1;
const BACKUP_REMIND_DAYS = 14;    // 前回から何日たったら勧めるか
const BACKUP_REMIND_COUNT = 10;   // 前回から何件の工事が増えた・直したら勧めるか

let crcTable;
function crc32(buf, crc = 0) {
  if (!crcTable) {
    crcTable = new Uint32Array(256);
    for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; crcTable[n] = c >>> 0; }
  }
  crc = ~crc;
  for (let i = 0; i < buf.length; i++) crc = crcTable[(crc ^ buf[i]) & 0xff] ^ (crc >>> 8);
  return ~crc >>> 0;
}
function dosTime(ts) {
  const d = new Date(ts);
  return { time: (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1),
    date: ((Math.max(1980, d.getFullYear()) - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate() };
}
// entries: [{ name, data: Uint8Array | Blob, mtime }] → ZIP の Blob(無圧縮、ファイル名は UTF-8)
async function makeZip(entries, onProgress) {
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  for (let i = 0; i < entries.length; i++) {
    const e = entries[i];
    const bytes = e.data instanceof Blob ? new Uint8Array(await e.data.arrayBuffer()) : e.data;
    const name = enc.encode(e.name);
    const crc = crc32(bytes), t = dosTime(e.mtime || Date.now());
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, t.time, true); lh.setUint16(12, t.date, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, bytes.length, true); lh.setUint32(22, bytes.length, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(lh.buffer, name, e.data instanceof Blob ? e.data : bytes);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, t.time, true); ch.setUint16(14, t.date, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, bytes.length, true); ch.setUint32(24, bytes.length, true); ch.setUint16(28, name.length, true);
    ch.setUint32(42, offset, true);
    central.push(ch.buffer, name);
    offset += 30 + name.length + bytes.length;
    if (offset > 0xfffffff0) throw new Error('too_large');
    if (onProgress) onProgress(i + 1, entries.length);
  }
  const cdSize = central.reduce((n, p) => n + p.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end.buffer], { type: 'application/zip' });
}
// ZIP の目次を読む → { 名前: { blob(), text() } }。無圧縮のものだけ(このアプリが作った ZIP 用)
async function readZip(file) {
  const tailLen = Math.min(file.size, 22 + 65535);
  const tail = new DataView(await file.slice(file.size - tailLen).arrayBuffer());
  let p = -1;
  for (let i = tailLen - 22; i >= 0; i--) if (tail.getUint32(i, true) === 0x06054b50) { p = i; break; }
  if (p < 0) throw new Error('not_zip');
  const count = tail.getUint16(p + 10, true), cdSize = tail.getUint32(p + 12, true), cdOff = tail.getUint32(p + 16, true);
  const cd = new DataView(await file.slice(cdOff, cdOff + cdSize).arrayBuffer());
  const dec = new TextDecoder();
  const out = {};
  let q = 0;
  for (let i = 0; i < count; i++) {
    if (cd.getUint32(q, true) !== 0x02014b50) throw new Error('bad_zip');
    const method = cd.getUint16(q + 10, true), size = cd.getUint32(q + 20, true);
    const nl = cd.getUint16(q + 28, true), xl = cd.getUint16(q + 30, true), cl = cd.getUint16(q + 32, true);
    const lho = cd.getUint32(q + 42, true);
    const name = dec.decode(new Uint8Array(cd.buffer, q + 46, nl));
    q += 46 + nl + xl + cl;
    if (method !== 0) continue;
    const entry = { lho, size, start: null };
    const start = async () => {
      if (entry.start === null) {
        const lh = new DataView(await file.slice(lho, lho + 30).arrayBuffer());
        entry.start = lho + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);
      }
      return entry.start;
    };
    out[name] = {
      blob: async (type) => { const s = await start(); return new Blob([file.slice(s, s + size)], { type: type || '' }); },
      text: async () => { const s = await start(); return file.slice(s, s + size).text(); }
    };
  }
  return out;
}

async function backupNeeded() {
  const recs = await dbAll('records');
  if (!recs.length) return false;
  const last = await kvGet('lastBackup');
  const since = last ? last.at : 0;
  const changed = recs.filter((r) => (r.updatedAt || r.createdAt || 0) > since).length;
  if (!changed) return false;
  if (changed >= BACKUP_REMIND_COUNT) return true;
  const base = last ? last.at : Math.min(...recs.map((r) => r.createdAt || Date.now()));
  return Date.now() - base >= BACKUP_REMIND_DAYS * 86400000;
}
async function backupBanner() {
  if (!(await backupNeeded())) return null;
  try { if (sessionStorage.getItem('hideBackup')) return null; } catch (e) { /* 無視 */ }
  const box = h('div', { class: 'banner' },
    h('button', { class: 'x', 'aria-label': '閉じる', onClick: () => { try { sessionStorage.setItem('hideBackup', '1'); } catch (e) { /* 無視 */ } box.remove(); } }, '×'),
    h('b', null, 'バックアップをおすすめします'),
    h('div', null, '記録はこのスマホの中だけにあります。機種変更や故障に備えて、バックアップを作って保存してください。'),
    h('div', { style: { marginTop: '8px' } }, h('button', { class: 'btn sm pri', onClick: () => go('#backup') }, 'バックアップを作る')));
  return box;
}
function fmtSize(bytes) { return bytes >= 1048576 ? '約' + Math.max(1, Math.round(bytes / 1048576)) + 'MB' : '約' + Math.max(1, Math.round(bytes / 1024)) + 'KB'; }

async function buildBackup(siteIds, onProgress) {
  const sites = (await dbAll('sites')).filter((s) => siteIds.has(s.id));
  const siteName = Object.fromEntries(sites.map((s) => [s.id, s.name]));
  const recs = (await dbAll('records')).map(normRec).filter((r) => siteIds.has(r.siteId));
  const files = [], used = new Set();
  const outRecs = recs.map((r) => {
    const photos = r.photos.map((p, i) => {
      let name = '写真/' + safeName(siteName[r.siteId] || '現場') + '/' + ymd(new Date(r.createdAt)) + '_' + r.id.slice(-6) + '_' + (i + 1) + '_' + (p.kind || '写真') + '.jpg';
      if (used.has(name)) name = name.replace(/\.jpg$/, '_' + p.id.slice(-4) + '.jpg');
      used.add(name);
      files.push({ name, data: p.blob, mtime: p.shotAt });
      return { id: p.id, kind: p.kind, shotAt: p.shotAt, fileMtime: p.fileMtime || null, src: p.src || null, memo: p.memo || '', file: name, type: p.blob && p.blob.type || 'image/jpeg' };
    });
    const { photo, ...rest } = r;   // 旧形式の写真(normRec で photos に読み替え済み)は入れない
    return Object.assign({}, rest, { photos });
  });
  const data = {
    app: BACKUP_APP, format: BACKUP_FORMAT, version: CONFIG.VERSION, createdAt: Date.now(),
    author: (await kvGet('author')) || '', company: (await kvGet('company')) || '',
    sites, records: outRecs
  };
  const json = new TextEncoder().encode(JSON.stringify(data));
  const zip = await makeZip([{ name: 'data.json', data: json }, ...files], onProgress);
  return { zip, siteCount: sites.length, recCount: recs.length, photoCount: files.length };
}

// mode: 'merge'(今のデータは残し、足りないもの・新しいものだけ入れる) | 'replace'(全部入れ替える)
async function restoreBackup(file, mode, onProgress) {
  const zip = await readZip(file);
  if (!zip['data.json']) throw new Error('no_data');
  const data = JSON.parse(await zip['data.json'].text());
  if (!data || data.app !== BACKUP_APP || !Array.isArray(data.sites) || !Array.isArray(data.records)) throw new Error('not_backup');
  if (data.format > BACKUP_FORMAT) throw new Error('newer_format');
  if (mode === 'replace') {
    const d = await db();
    await new Promise((res, rej) => {
      const t = d.transaction(['sites', 'records'], 'readwrite');
      t.objectStore('sites').clear(); t.objectStore('records').clear();
      t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  }
  const siteIds = new Set();
  let addedSites = 0, addedRecs = 0, updatedRecs = 0, skipped = 0;
  for (const s of data.sites) {
    if (!s || !s.id || !s.name) continue;
    siteIds.add(s.id);
    if (!(await dbGet('sites', s.id))) { await dbPut('sites', { id: s.id, name: String(s.name), createdAt: s.createdAt || Date.now() }); addedSites++; }
  }
  for (let i = 0; i < data.records.length; i++) {
    const r = data.records[i];
    if (onProgress) onProgress(i + 1, data.records.length);
    if (!r || !r.id || !siteIds.has(r.siteId)) { skipped++; continue; }
    const cur = await dbGet('records', r.id);
    if (cur && (normRec(cur).updatedAt || 0) >= (r.updatedAt || 0)) { skipped++; continue; }
    const photos = [];
    for (const p of r.photos || []) {
      const ent = p && zip[p.file];
      if (!ent) continue;
      photos.push({ id: p.id || uid(), blob: await ent.blob(p.type || 'image/jpeg'), kind: p.kind || KINDS[0], shotAt: p.shotAt || r.createdAt,
        fileMtime: p.fileMtime || null, src: p.src || null, memo: p.memo || '' });
    }
    await dbPut('records', {
      id: r.id, siteId: r.siteId, createdAt: r.createdAt || Date.now(), updatedAt: r.updatedAt || r.createdAt || Date.now(),
      location: r.location || '', content: r.content || '', work: r.work || '', people: r.people == null ? '' : r.people,
      photos, draft: !!r.draft
    });
    if (cur) updatedRecs++; else addedRecs++;
  }
  if (mode === 'replace' || !(await kvGet('author'))) {
    if (data.author) await kvSet('author', data.author);
    if (data.company) await kvSet('company', data.company);
  }
  return { addedSites, addedRecs, updatedRecs, skipped, createdAt: data.createdAt };
}

async function viewBackup() {
  const sites = await dbAll('sites');
  const recs = (await dbAll('records')).map(normRec);
  const cnt = {}, pics = {};
  recs.forEach((r) => { cnt[r.siteId] = (cnt[r.siteId] || 0) + 1; pics[r.siteId] = (pics[r.siteId] || 0) + r.photos.length; });
  const last = await kvGet('lastBackup');
  const checks = sites.map((s) => {
    const cb = h('input', { type: 'checkbox', checked: true, value: s.id, style: { width: '22px', height: '22px', flex: 'none' } });
    return { cb, row: h('label', { style: { display: 'flex', alignItems: 'center', gap: '10px', padding: '6px 0' } }, cb,
      h('span', null, s.name, h('span', { class: 'mute' }, '　工事' + (cnt[s.id] || 0) + '件・写真' + (pics[s.id] || 0) + '枚'))) };
  });
  const status = h('p', { class: 'mute', style: { margin: '8px 0 0' } }, '');
  const makeBtn = h('button', { class: 'btn pri' }, 'バックアップを作る');
  const shareBtn = h('button', { class: 'btn pri', style: { display: 'none' } }, '保存・共有する');
  const dlBtn = h('button', { class: 'btn', style: { display: 'none', marginTop: '10px' } }, '共有できないときは、ここから保存');
  let zipFile = null;   // iOS は操作から時間が空くと共有を拒否するため、先に作っておいて2回目の操作で共有する
  const markDone = async () => { await kvSet('lastBackup', { at: Date.now() }); };
  const download = async (file) => {
    const u = URL.createObjectURL(file);
    const a = h('a', { href: u, download: file.name }); document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 60000);
    await markDone();
    toast('バックアップを保存しました');
  };
  makeBtn.addEventListener('click', async () => {
    const ids = new Set(checks.filter((c) => c.cb.checked).map((c) => c.cb.value));
    if (!ids.size) return toast('現場を選んでください');
    makeBtn.disabled = true; zipFile = null; shareBtn.style.display = 'none'; dlBtn.style.display = 'none';
    status.textContent = 'バックアップを作っています…';
    try {
      const r = await buildBackup(ids, (i, n) => { status.textContent = 'バックアップを作っています… ' + i + ' / ' + n; });
      zipFile = new File([r.zip], '追加変更記録_バックアップ_' + ymd(new Date()) + '.zip', { type: 'application/zip' });
      status.textContent = '現場' + r.siteCount + '件・工事' + r.recCount + '件・写真' + r.photoCount + '枚（' + fmtSize(zipFile.size) + '）。下のボタンで保存してください。';
      shareBtn.style.display = ''; dlBtn.style.display = '';
    } catch (e) {
      console.error(e);
      status.textContent = e && e.message === 'too_large' ? '大きすぎて作れませんでした。現場を分けて作ってください。' : 'バックアップを作れませんでした。もう一度お試しください。';
    }
    makeBtn.disabled = false;
  });
  shareBtn.addEventListener('click', async () => {
    if (!zipFile) return;
    if (navigator.canShare && navigator.canShare({ files: [zipFile] })) {
      try { await navigator.share({ files: [zipFile], title: zipFile.name }); await markDone(); toast('バックアップを渡しました'); return; }
      catch (e) { if (e && e.name === 'AbortError') return; /* 共有できないときは保存に切り替える */ }
    }
    download(zipFile);
  });
  dlBtn.addEventListener('click', () => { if (zipFile) download(zipFile); });

  const fileIn = h('input', { type: 'file', accept: '.zip,application/zip', style: { display: 'none' } });
  const mergeBtn = h('button', { class: 'btn', onClick: () => { fileIn.dataset.mode = 'merge'; fileIn.click(); } }, '戻す（今の記録は残す）');
  const replaceBtn = h('button', { class: 'btn danger', style: { marginTop: '10px' }, onClick: () => {
    if (!confirm('今このスマホにある記録と写真をすべて消して、バックアップの内容に入れ替えます。よろしいですか？')) return;
    if (!confirm('消した記録は元に戻せません。本当に入れ替えますか？')) return;
    fileIn.dataset.mode = 'replace'; fileIn.click();
  } }, '入れ替える（今の記録は消える）');
  const rstatus = h('p', { class: 'mute', style: { margin: '8px 0 0' } }, '');
  fileIn.addEventListener('change', async () => {
    const f = fileIn.files && fileIn.files[0];
    fileIn.value = '';
    if (!f) return;
    mergeBtn.disabled = replaceBtn.disabled = true;
    rstatus.textContent = '読み込んでいます…';
    try {
      const r = await restoreBackup(f, fileIn.dataset.mode === 'replace' ? 'replace' : 'merge', (i, n) => { rstatus.textContent = '読み込んでいます… ' + i + ' / ' + n; });
      rstatus.textContent = '';
      toast('戻しました（工事 追加' + r.addedRecs + '件・更新' + r.updatedRecs + '件）');
      return go('#sites');
    } catch (e) {
      console.error(e);
      const m = e && e.message;
      rstatus.textContent = m === 'not_zip' || m === 'bad_zip' || m === 'no_data' || m === 'not_backup' ? 'このアプリのバックアップファイルではないようです。'
        : m === 'newer_format' ? '新しい版のアプリで作られたバックアップです。アプリを最新にしてからお試しください。'
        : '戻せませんでした。もう一度お試しください。';
    }
    mergeBtn.disabled = replaceBtn.disabled = false;
  });

  mount(
    topBar('バックアップ', { back: () => go('#settings') }),
    h('main', null,
      h('div', { class: 'card' },
        h('h2', null, 'バックアップを作る'),
        h('p', { style: { margin: '0 0 6px' } }, '記録と写真を1つのファイルにまとめます。「ファイル」アプリ、Googleドライブ、パソコンなど、このスマホ以外の場所に保存してください。'),
        h('p', { class: 'mute', style: { margin: '0 0 8px' } }, '最後のバックアップ: ' + (last ? fmtDate(last.at) : 'まだありません') + '。ファイルはサーバーには送られません。'),
        sites.length ? h('div', null, checks.map((c) => c.row)) : h('p', { class: 'mute' }, 'まだ記録がありません。'),
        h('div', { style: { height: '8px' } }),
        sites.length ? makeBtn : null, status,
        h('div', { style: { height: '8px' } }), shareBtn, dlBtn),
      h('div', { class: 'card' },
        h('h2', null, 'バックアップから戻す'),
        h('p', { style: { margin: '0 0 8px' } }, '保存しておいたバックアップファイル（.zip）を選びます。同じ工事がスマホにもあるときは、新しく直した方を残します。'),
        mergeBtn, replaceBtn, rstatus, fileIn)));
}

/* ============================================================

async function viewFeedback() {
  const cat = h('select', { id: 'fb-cat' },
    ['使いやすさ', '不具合', 'ほしい機能', 'その他'].map((t) => h('option', { value: t }, t)));
  const text = h('textarea', { id: 'fb-text', rows: '6', maxlength: '250', placeholder: '例: 写真を撮るボタンが小さい／用紙のこの部分が見づらい', style: { width: '100%', boxSizing: 'border-box' } });
  const count = h('p', { class: 'mute', style: { textAlign: 'right', margin: '4px 0 0' } }, '0 / 250');
  text.addEventListener('input', () => { count.textContent = text.value.length + ' / 250'; });
  const btn = h('button', { class: 'btn pri' }, '送信する');
  btn.addEventListener('click', async () => {
    const t = text.value.trim();
    if (!t) return toast('ご意見を入力してください');
    btn.disabled = true; btn.textContent = '送信中…';
    try {
      if (!CONFIG.APPROVAL_URL) throw new Error('no_url');
      const url = CONFIG.APPROVAL_URL + '?action=feedback&id=' + encodeURIComponent(await deviceId()) +
        '&name=' + encodeURIComponent((await kvGet('author')) || '') +
        '&company=' + encodeURIComponent((await kvGet('company')) || '') +
        '&cat=' + encodeURIComponent(cat.value) + '&v=' + encodeURIComponent(CONFIG.VERSION) +
        '&text=' + encodeURIComponent(t);
      const r = await fetchJSON(url, 20000);
      if (!r || !r.ok) throw new Error('fail');
      toast('送信しました。ありがとうございます');
      go('#sites');
    } catch (e) {
      btn.disabled = false; btn.textContent = '送信する';
      toast('送信できませんでした。電波のよい場所でもう一度お試しください');
    }
  });
  mount(
    topBar('ご意見・ご要望', { back: () => go('#sites') }),
    h('main', null,
      h('div', { class: 'card' },
        h('p', { style: { margin: '0 0 10px' } }, '使いにくい点、困ったこと、あったらよい機能などをお知らせください。お名前と会社名もあわせて送られます。'),
        h('label', { class: 'lb', for: 'fb-cat' }, '内容の種類'), cat,
        h('div', { style: { height: '12px' } }),
        h('label', { class: 'lb', for: 'fb-text' }, 'ご意見（250文字まで）'), text, count),
      btn));
}
